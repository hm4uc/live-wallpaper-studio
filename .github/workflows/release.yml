# Publishes to Open VSX (Antigravity IDE, Cursor, …) and the VS Code Marketplace.
# Trigger: push a tag like v1.0.1  (npm run release:patch does this for you)
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    outputs:
      vsix: ${{ steps.pkg.outputs.vsix }}
      version: ${{ steps.pkg.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG"
            exit 1
          fi
      - name: Package VSIX
        id: pkg
        run: |
          npx vsce package --no-dependencies --readme-path README.marketplace.md
          VSIX=$(ls *.vsix)
          echo "vsix=$VSIX" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: '*.vsix'

  open-vsx:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vsix
      - name: Publish to Open VSX (Antigravity IDE)
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -n "$OVSX_PAT" ]; then
            npx --yes ovsx@1 publish "${{ needs.package.outputs.vsix }}" --skip-duplicate
          else
            unset OVSX_PAT
            npx --yes ovsx@1 publish "${{ needs.package.outputs.vsix }}" --trusted-publishing --skip-duplicate
          fi

  vs-marketplace:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # trusted publishing (OIDC) — no Azure token stored anywhere
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vsix
      - name: Publish to VS Code Marketplace
        run: npx --yes @vscode/vsce@4 publish --oidc --packagePath "${{ needs.package.outputs.vsix }}" --skip-duplicate

  github-release:
    needs: [package, open-vsx, vs-marketplace]
    if: startsWith(github.ref, 'refs/tags/v') && !cancelled() && needs.package.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: vsix
      - name: Create GitHub Release with the VSIX attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Open VSX (Antigravity IDE): https://open-vsx.org/extension/derekhoang/live-wallpaper-studio
          VS Code Marketplace: https://marketplace.visualstudio.com/items?itemName=derekhoang.live-wallpaper-studio"
          gh release create "$GITHUB_REF_NAME" "${{ needs.package.outputs.vsix }}" --title "$GITHUB_REF_NAME" --notes "$NOTES" --verify-tag
